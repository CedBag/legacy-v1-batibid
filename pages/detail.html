<div style="max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter);">
  <div class="detail-property-layout">
    <div>
      <div class="panorama-360-container">
        <canvas id="panorama-360" class="panorama-canvas"></canvas>
        <div class="panorama-overlay-info">

      <h2 class="headline-lg" id="detail-title">Appartement de Standing</h2>
      <div class="property-card-location" style="font-size: 1.1rem; margin: 1rem 0;" id="detail-location">

      </div>
      
      <div style="display: flex; gap: 2rem; background-color: var(--white); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--gray-300); margin-bottom: 2rem;">
        <div>
          <span style="display: block; font-size: 0.85rem; color: var(--gray-600);">Chambres</span>
          <strong style="font-size: 1.2rem; color: var(--secondary);" id="detail-beds">2</strong>

          <span style="display: block; font-size: 0.85rem; color: var(--gray-600);">Salles de bain</span>
          <strong style="font-size: 1.2rem; color: var(--secondary);" id="detail-baths">2</strong>
        </div>
        <div style="border-left: 1px solid var(--gray-400); padding-left: 2rem;">
          <span style="display: block; font-size: 0.85rem; color: var(--gray-600);">Superficie</span>
          <strong style="font-size: 1.2rem; color: var(--secondary);"><span id="detail-surface">95</span> m²</strong>
        </div>
        <div style="border-left: 1px solid var(--gray-400); padding-left: 2rem;">
          <span style="display: block; font-size: 0.85rem; color: var(--gray-600);">Type</span>
          <strong style="font-size: 1.2rem; color: var(--secondary);" id="detail-type">Appartement</strong>
        </div>
      </div>
      
      <h3 class="headline-md mb-4">Description</h3>
      <p class="body-md" style="line-height: 1.7; color: var(--secondary-light); margin-bottom: 3rem;" id="detail-desc">

      </p>

    <div id="detail-cta-box">
      <!-- Dynamic CTA sidebar filled by app.js -->
    </div>
