<div class="payment-card">
  <h2 class="headline-md text-center mb-4"><i class="fas fa-lock" style="color: var(--success); margin-right: 0.5rem;"></i> Règlement du loyer</h2>
  
  <div style="background-color: var(--gray-100); padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--gray-300); margin-bottom: 2rem;">
    <span style="font-size: 0.85rem; color: var(--gray-600);">Bien concerné :</span>
    <h4 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem;" id="pay-prop-title">Appartement de Standing</h4>
    <div style="display: flex; justify-content: space-between; font-weight: 700; border-top: 1px dashed var(--gray-400); padding-top: 0.75rem; margin-top: 0.75rem;">
      <span>Loyer mensuel :</span>
      <span id="pay-prop-price" style="color: var(--primary);">150 000 FCFA</span>
    </div>
  </div>
  
  <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem;">Sélectionnez votre moyen de paiement</h4>
  <div class="payment-methods">
    <button class="pay-method-btn" id="method-mtn" onclick="selectPaymentMethod('mtn')">
      <span class="pay-method-logo-fallback mtn">MTN</span>
      <span style="font-size: 0.8rem; font-weight: 700;">MoMo</span>
    </button>
    <button class="pay-method-btn" id="method-moov" onclick="selectPaymentMethod('moov')">
      <span class="pay-method-logo-fallback moov">Moov</span>
      <span style="font-size: 0.8rem; font-weight: 700;">Flooz</span>
    </button>
    <button class="pay-method-btn" id="method-celtiis" onclick="selectPaymentMethod('celtiis')">
      <span class="pay-method-logo-fallback celtiis">Celtiis</span>
      <span style="font-size: 0.8rem; font-weight: 700;">Cash</span>
    </button>
  </div>
  
  <form onsubmit="submitPayment(event)">
    <div class="form-group">
      <label class="form-label" id="pay-phone-label" for="pay-phone-input">Numéro Mobile Money</label>
      <input type="tel" id="pay-phone-input" class="form-control" required placeholder="Ex: 97 00 00 00">
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 2rem 0; border-top: 2px solid var(--secondary); padding-top: 1rem;">
      <span style="font-weight: 700;">Montant total à débiter :</span>
      <strong style="font-size: 1.5rem; color: var(--primary);" id="pay-total-amount">150 000 FCFA</strong>
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%;">
      <i class="fas fa-check-circle" style="margin-right: 0.5rem;"></i> Confirmer le règlement
    </button>
  </form>
</div>
